apiVersion: v1
kind: Service
metadata:
  name: {{ include "server.names.fullname" . }}
  namespace: {{ include "server.names.namespace" . }}
  labels: {{- include "server.labels.standard" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "server.labels.matchLabels" . | nindent 4 }}
