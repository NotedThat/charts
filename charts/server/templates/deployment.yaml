{{- include "server.validateValues" . -}}
{{- $fullName := include "server.names.fullname" . -}}
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ include "server.names.namespace" . }}
  labels: {{- include "server.labels.standard" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "server.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "server.labels.matchLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
      {{- $prometheusPodAnnotations := dict -}}
      {{- if and .Values.metrics.enabled .Values.metrics.podAnnotations.enabled -}}
      {{- $prometheusPodAnnotations = dict "prometheus.io/scrape" "true" "prometheus.io/path" .Values.metrics.path "prometheus.io/port" (toString .Values.containerPorts.metrics) -}}
      {{- end -}}
      {{- /* Credentials and settings are a startup snapshot: roll the pod when they change. */ -}}
      {{- $checksums := dict "checksum/secret" (include "server.secretData" . | sha256sum) -}}
      {{- $podAnnotations := merge (dict) (.Values.podAnnotations | default dict) $prometheusPodAnnotations $checksums }}
      annotations: {{- include "common.tplvalues.render" (dict "value" $podAnnotations "context" $) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "server.serviceAccountName" . }}
      {{- include "common.images.renderPullSecrets" (dict "images" (list .Values.image) "context" $) | nindent 6 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # Upload and index staging (NOTEDTHAT_UPLOAD_TMP_DIR). Disk-backed on purpose.
        - name: staging
          emptyDir:
            {{- if .Values.staging.sizeLimit }}
            sizeLimit: {{ .Values.staging.sizeLimit }}
            {{- else }} {}
            {{- end }}
        {{- if and .Values.oidc.issuer (or .Values.oidc.caCert.existingConfigMap .Values.oidc.caCert.existingSecret) }}
        - name: oidc-ca
          {{- if .Values.oidc.caCert.existingConfigMap }}
          configMap:
            name: {{ tpl .Values.oidc.caCert.existingConfigMap $ }}
          {{- else }}
          secret:
            secretName: {{ tpl .Values.oidc.caCert.existingSecret $ }}
          {{- end }}
            items:
              - key: {{ .Values.oidc.caCert.key }}
                path: ca.pem
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: server
          image: {{ include "server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.containerPorts.metrics }}
              protocol: TCP
            {{- end }}
          env: {{- include "server.env" . | nindent 12 }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- include "common.resources.preset.apply" (dict "type" .Values.resourcesPreset "resources" .Values.resources) | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe: {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: staging
              mountPath: {{ .Values.staging.mountPath }}
            {{- if and .Values.oidc.issuer (or .Values.oidc.caCert.existingConfigMap .Values.oidc.caCert.existingSecret) }}
            - name: oidc-ca
              mountPath: /etc/notedthat/oidc
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
