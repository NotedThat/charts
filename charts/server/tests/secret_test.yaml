suite: secret
templates:
  - secret.yaml
values:
  - values/required.yaml
tests:
  - it: stores inline credentials
    asserts:
      - equal:
          path: data["api-token"]
          value: dA==
      - equal:
          path: data["s3-secret-access-key"]
          value: c2s=
      - notExists:
          path: data["qdrant-api-key"]

  - it: is not rendered when every block uses an existing secret
    set:
      auth.existingSecret: a
      s3.existingSecret: b
      embedding.existingSecret: c
    asserts:
      - hasDocuments:
          count: 0
