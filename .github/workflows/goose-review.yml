# LLM review of the pull request's diff with Goose (block/goose), through
# StephanMeijer/goose-review, pinned below by commit. What the review looks
# for is this repository's: the checks (.agents/checks/), the facts
# (.agents/facts/), the provider templates (.github/goose/providers/), the
# tools installed for the model (helm, kubeconform, kube-linter, actionlint)
# and the Helm tool hints (.agents/goose-review/tools.md).
#
# Three lanes, one per model: DeepSeek V4 Flash and Mistral Medium 3.5 on
# the third-party endpoint, and MiniMax M3. Each lane runs the checks that
# cover the changed files with its own model; a model of another family
# re-checks every finding against the code, and only confirmed findings are
# posted, signed with both models. Each verifier has the other as its backup
# for when its provider is down. Advisory only: it posts COMMENT reviews and
# never fails the pull request.
#
# Every model call goes through the self-hosted egress proxy, which holds
# the provider keys: its routes are the GOOSE_THIRDPARTY_BASE_URL and
# GOOSE_MINIMAX_BASE_URL secrets, its token GOOSE_PROXY_TOKEN, its host the
# GOOSE_PROXY_EGRESS variable (the only host the review job may reach beyond
# GitHub and the downloads below). The review runs only once that variable
# is set.
name: Goose review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A push never cancels a review in progress: it finishes and posts, and the
# newest push is reviewed after it (pushes in between are skipped; every run
# reviews the whole diff).
concurrency:
  group: goose-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  goose-review:
    # Fork PRs get no secrets; release PRs are generated; drafts wait until
    # they are marked ready.
    if: >-
      vars.GOOSE_PROXY_EGRESS != ''
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'release-please-')
      && !startsWith(github.event.pull_request.title, 'chore(main): release')
    # main after StephanMeijer/goose-review#3 (the `tools` input), until v0.4.0 is released.
    uses: StephanMeijer/goose-review/.github/workflows/review.yml@c192a2a3b7679e5bd7cc601cee4f40e8940846f2 # main
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    with:
      lanes: |
        - lane: deepseek
          provider: thirdparty
          model: deepseek-v4-flash-0731
          verify-provider: minimax
          verify-model: MiniMax-M3
          verify-backup-provider: thirdparty
          verify-backup-model: deepseek-v4-flash-0731
          # The endpoint caps DeepSeek's input tokens a minute, and every
          # agent turn resends the whole conversation.
          jobs: 2

        - lane: minimax
          provider: minimax
          model: MiniMax-M3
          verify-provider: thirdparty
          verify-model: deepseek-v4-flash-0731
          verify-backup-provider: minimax
          verify-backup-model: MiniMax-M3
          jobs: 3

        - lane: mistral
          provider: thirdparty
          model: mistral-medium-3-5
          verify-provider: minimax
          verify-model: MiniMax-M3
          verify-backup-provider: thirdparty
          verify-backup-model: deepseek-v4-flash-0731
          jobs: 2
      # Installed before setup, each pinned by sha256, and announced to the
      # model with its `use` line; the commands are in tools.md.
      tools: |
        - name: helm
          version: v4.1.4
          url: https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz
          sha256: 70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09
          path: linux-amd64/helm
          use: "Lint and render the charts (`helm lint`, `helm template`), the same Helm as CI; the dependencies are built."
        - name: kubeconform
          version: v0.8.0
          url: https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          sha256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          use: "Validate rendered manifests against the Kubernetes 1.28 schemas in $KUBE_SCHEMAS (offline)."
        - name: kube-linter
          version: v0.8.3
          url: https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz
          sha256: 1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df
          use: "Lint rendered manifests for security and reliability (`kube-linter lint -`)."
        - name: actionlint
          version: v1.7.12
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          use: "Lint a workflow: `actionlint .github/workflows/<file>` (runs shellcheck on its scripts)."
      # Before any secret or model: the charts' dependencies (the server
      # chart's is the released common chart, pulled anonymously from
      # ghcr.io), so the model can render every chart offline, and the
      # Kubernetes 1.28 JSON schemas for kubeconform.
      setup: |
        helm dependency build charts/server
        helm dependency build ci/common
        helm dependency build ci/server
        git clone -q --depth 1 --filter=blob:none --sparse \
          https://github.com/yannh/kubernetes-json-schema "$RUNNER_TEMP/kubernetes-json-schema"
        git -C "$RUNNER_TEMP/kubernetes-json-schema" sparse-checkout set v1.28.0-standalone-strict
        echo "KUBE_SCHEMAS=$RUNNER_TEMP/kubernetes-json-schema" >> "$GITHUB_ENV"
      egress-endpoints: >-
        ["get.helm.sh:443", "ghcr.io:443", "pkg-containers.githubusercontent.com:443",
        "${{ vars.GOOSE_PROXY_EGRESS }}"]
      tools-file: .agents/goose-review/tools.md
      # Never reviewed: generated lock files and packaged charts. The
      # CHANGELOG.md files are reviewed: release PRs are skipped above, so a
      # change to one here is a hand edit, which the docs-drift check flags.
      ignore: |
        **/Chart.lock
        **/*.tgz
        LICENSE
    secrets:
      PROVIDER_ROUTES: |
        thirdparty=${{ secrets.GOOSE_THIRDPARTY_BASE_URL }}
        minimax=${{ secrets.GOOSE_MINIMAX_BASE_URL }}
      PROVIDER_ENV: |
        GOOSE_PROXY_TOKEN=${{ secrets.GOOSE_PROXY_TOKEN }}
