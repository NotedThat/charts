## Top-level values for parent-chart test template (test-render.yaml calls
## server.image / server.serviceAccountName with the parent's context).
image:
  registry: ghcr.io
  repository: notedthat/server
  tag: "0.12.0"

serviceAccount:
  create: true
  name: ""

global:
  imageRegistry: ""
  imagePullSecrets: []

## Subchart values — Helm scopes these into the server subchart's context.
server:
  replicaCount: 1

  auth:
    apiToken: ci-token
    webdav:
      username: ci-webdav
      password: ci-webdav-password

  knowledgebases:
    - notes
    - scratch

  s3:
    region: us-east-1
    endpointUrl: http://seaweedfs.storage.svc.cluster.local:8333
    forcePathStyle: true
    accessKeyId: ci-access-key
    secretAccessKey: ci-secret-key

  qdrant:
    url: http://qdrant.storage.svc.cluster.local:6334

  embedding:
    endpointUrl: http://tei.storage.svc.cluster.local:80
    model: BAAI/bge-m3
    dimensions: 1024
    apiKey: any

  events:
    backend: memory

  server:
    maxPatchableSize: 104857600

  image:
    registry: ghcr.io
    repository: notedthat/server
    tag: "0.12.0"

  serviceAccount:
    create: true

  ingress:
    enabled: true
    hostname: test.notedthat.local
    path: /
    pathType: Prefix

  autoscaling:
    enabled: false

  resourcesPreset: "micro"
  resources: {}

  extraEnvVars:
    - name: TEST_VAR
      value: "test"

  containerPorts:
    http: 8080
    metrics: 9090

  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""

  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: false

  # CI-only: exercises BOTH template paths. In production pick serviceMonitor
  # OR podAnnotations, not both — running both causes duplicate scraping.
  metrics:
    enabled: true
    podAnnotations:
      enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
      namespaceSelector:
        any: true
